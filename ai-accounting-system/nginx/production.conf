    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #     server_name ledgerai.store www.ledgerai.store;
    #
    #     # SSL certificates
    #     ssl_certificate /etc/nginx/ssl/live/ledgerai.store/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/live/ledgerai.store/privkey.pem;
    #
    #     # SSL settings
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #     ssl_session_tickets off;
    #
    #     # Security headers (add HSTS for HTTPS)
    #     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    #     add_header X-Frame-Options "SAMEORIGIN" always;
    #     add_header X-Content-Type-Options "nosniff" always;
    #     add_header X-XSS-Protection "1; mode=block" always;
    #     add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    #
    #     # ... (copy all location blocks from the HTTP server above)
    # }
}
