global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      repeat_interval: 1h

receivers:
  - name: 'default'
    # Configure email or webhook as needed for your environment
    # email_configs:
    #   - to: 'admin@your-domain.com'
    #     from: 'alertmanager@your-domain.com'
    #     smarthost: 'smtp.your-domain.com:587'
    #     auth_username: 'alertmanager@your-domain.com'
    #     auth_password: 'password'
    # webhook_configs:
    #   - url: 'http://your-webhook-handler:9095/webhook'
    #     send_resolved: true

  - name: 'critical'
    # email_configs:
    #   - to: 'admin@your-domain.com'
    # webhook_configs:
    #   - url: 'http://your-webhook-handler:9095/webhook'
    #     send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
