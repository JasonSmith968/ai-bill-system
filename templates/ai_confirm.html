<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>AI识别结果</title>

    <style>

        body{
            font-family: Arial;
            background: #f5f5f5;
            padding: 40px;
        }

        .box{
            width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1{
            color: #16a34a;
        }

        table{
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,td{
            border-bottom: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        button{
            background: #16a34a;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>AI识别结果</h1>

    <table>

        <tr>
            <th>日期</th>
            <th>标题</th>
            <th>金额</th>
            <th>分类</th>
        </tr>

        {% for item in bills %}

        <tr>

            <td>{{ item.date }}</td>

            <td>{{ item.title }}</td>

            <td>{{ item.money }}</td>

            <td>{{ item.category }}</td>

        </tr>

        {% endfor %}

    </table>

    <br>

    <form action="/confirm_ai_bill" method="POST">

        <button type="submit">
            确认入账
        </button>

    </form>

</div>

</body>
</html>
